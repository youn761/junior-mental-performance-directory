<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Junior Mental Performance Finder{% endblock %}</title>
  <meta name="description" content="{% block meta_description %}Find sports psychologists and mental performance coaches who specialize in competitive junior athletes, including golf-focused and remote providers.{% endblock %}">
  <link rel="canonical" href="{{ request.url }}">

  <meta property="og:title" content="{% block og_title %}Junior Mental Performance Finder{% endblock %}">
  <meta property="og:description" content="{% block og_description %}Find sports psychologists and mental performance coaches who specialize in competitive junior athletes.{% endblock %}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ request.url }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/static/site.css">

  <!-- Privacy-friendly analytics by Plausible -->
  <script async src="https://plausible.io/js/pa--Ee8vJQusblWmHPYJOsUi.js"></script>
  <script>
    window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
    plausible.init()
  </script>
</head>
<body>
  <header class="header">
    <div class="container header-row">
      <a class="brand" href="/">Junior Mental Performance Finder</a>
      <nav class="nav">
        <a href="/coaches">Browse Coaches</a>
        <a href="/for-providers">For Providers</a>
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="container">
      <p class="small">
        Disclaimer: This directory is for informational purposes and does not provide medical advice.
        Always evaluate providers for fit and credentials.
      </p>
    </div>
  </footer>
</body>
</html>
